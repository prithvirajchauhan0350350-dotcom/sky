<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKY ASSISTANT HUB</title>
<style>
  :root{--bg:#05070d;--panel:#0a0f1a;--line:#13213a;--cy:#22d3ee;--cy2:#67e8f9;
        --dim:#5b6b85;--txt:#c9d6e8;--ok:#34d399;--warn:#f87171}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1200px 800px at 70% -10%,#0a1526 0%,var(--bg) 55%);
       color:var(--txt);font:14px/1.5 "Segoe UI",system-ui,sans-serif;height:100vh;
       display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:16px;padding:14px 22px;
         border-bottom:1px solid var(--line);background:#04060bcc}
  .core{width:44px;height:44px;border-radius:50%;flex:none;position:relative;
        background:radial-gradient(circle,#7ff3ff 0%,#0e7490 45%,transparent 72%);
        box-shadow:0 0 18px #0891b2aa,inset 0 0 14px #a5f3fc99;
        animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 12px #0891b288,inset 0 0 12px #a5f3fc77}
                   50%{box-shadow:0 0 28px #22d3eecc,inset 0 0 18px #cffafe99}}
  h1{font-size:16px;letter-spacing:5px;font-weight:600;color:var(--cy2)}
  h1 small{display:block;font-size:9px;letter-spacing:3px;color:var(--dim);font-weight:400;margin-top:2px}
  .st{margin-left:auto;display:flex;gap:16px;font-size:11px;letter-spacing:1px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:0}
  .dot.on{background:var(--ok);box-shadow:0 0 7px var(--ok)}
  .dot.off{background:var(--warn);box-shadow:0 0 7px var(--warn)}
  main{flex:1;display:flex;min-height:0}
  #chatcol{flex:1;display:flex;flex-direction:column;min-width:0}
  #chat{flex:1;overflow-y:auto;padding:20px 26px;display:flex;flex-direction:column;gap:12px}
  .bub{max-width:74%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
  .me{align-self:flex-end;background:#0e2a3d;border:1px solid #155e75;border-bottom-right-radius:4px}
  .sky{align-self:flex-start;background:var(--panel);border:1px solid var(--line);
       border-bottom-left-radius:4px;box-shadow:0 0 14px #06b6d41f}
  .sky::before{content:"SKY";display:block;font-size:9px;letter-spacing:3px;color:var(--cy);margin-bottom:4px}
  #confirmbar{display:none;margin:0 26px 8px;padding:10px 14px;border:1px solid #9a3412;
              background:#1c0d06;border-radius:10px;color:#fdba74;font-size:13px}
  #confirmbar b{color:#fed7aa}
  #confirmbar button{margin-left:10px;padding:4px 14px;border-radius:6px;font-weight:700;
              cursor:pointer;border:1px solid #155e75;background:#083344;color:#a5f3fc}
  #confirmbar button.no{border-color:#7f1d1d;background:#1c0a0a;color:#fca5a5}
  form{display:flex;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:#04060bcc}
  #inp{flex:1;background:#070c16;border:1px solid var(--line);border-radius:10px;
       color:var(--txt);padding:12px 14px;font-size:14px;outline:none}
  #inp:focus{border-color:var(--cy);box-shadow:0 0 12px #06b6d455}
  form button{background:#083344;border:1px solid #155e75;color:#a5f3fc;border-radius:10px;
       padding:11px 18px;font-weight:700;cursor:pointer}
  #mic.rec{background:#7f1d1d;border-color:#ef4444;animation:pulse 1s infinite}
  /* ---- SKY VIDEO CALL panel ---- */
  #avcall{margin:14px 26px 0;border:1px solid #164e63;border-radius:14px;overflow:hidden;
          background:#030608;position:relative;height:240px;flex:none;
          box-shadow:0 0 24px #06b6d426;cursor:pointer}
  #avimg,#avvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
                object-position:50% 22%}
  #avimg{animation:breathe 3.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
  #avvid{display:none}
  .avtop{position:absolute;top:10px;left:12px;display:flex;gap:8px;align-items:center;
         font-size:10px;letter-spacing:2px;color:#fecaca;text-shadow:0 0 6px #7f1d1d}
  .avlive{width:7px;height:7px;border-radius:50%;background:var(--warn);
          box-shadow:0 0 8px var(--warn);animation:pulse 1.6s infinite}
  .avname{position:absolute;left:12px;bottom:10px;font-size:11px;letter-spacing:3px;
          color:#e0f2fe;background:#020408b3;padding:4px 10px;border-radius:8px;
          border:1px solid #155e7555}
  .avstat{position:absolute;right:12px;bottom:12px;font-size:10px;letter-spacing:2px;
          color:var(--cy)}
  #avcall.talking{border-color:var(--cy);box-shadow:0 0 34px #22d3ee66}
  #avcall.talking .avstat{color:var(--cy2);text-shadow:0 0 8px #22d3ee}
  .avmute{position:absolute;right:12px;top:10px;font-size:14px;opacity:.75}
  aside{width:320px;border-left:1px solid var(--line);padding:16px;overflow-y:auto;
        background:#04060b;display:flex;flex-direction:column;gap:14px}
  .card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px}
  .card h3{font-size:10px;letter-spacing:3px;color:var(--cy);margin-bottom:8px}
  .card pre{white-space:pre-wrap;font:11px/1.65 Consolas,monospace;color:#9fb3cc;
            max-height:300px;overflow-y:auto}
  .rem{padding:6px 0;border-bottom:1px dashed #14243d;font-size:12px}
  .rem b{color:#7dd3fc;font-weight:600;margin-right:6px}
  .none{color:var(--dim);font-size:12px}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#14263f;border-radius:8px}
</style>
</head>
<body>
<header>
  <div class="core"></div>
  <h1>SKY ASSISTANT HUB<small>J.A.R.V.I.S. INTERFACE &middot; OMNIBRAIN LINKED</small></h1>
  <a class="hublink" href="/spy" style="margin-left:auto;text-decoration:none;font-size:12px;
     color:#5b6b85;border:1px solid #13213a;padding:6px 12px;border-radius:8px">SPY CONSOLE &rarr;</a>
  <div class="st">
    <span><span class="dot off" id="st-ear"></span>EAR</span>
    <span><span class="dot off" id="st-skyd"></span>SKYD</span>
  </div>
</header>
<main>
  <section id="chatcol">
    <div id="avcall" title="Click to unmute / mute">
      <img id="avimg" src="/avatar/portrait.jpg" alt="SKY">
      <video id="avvid" muted loop playsinline></video>
      <div class="avtop"><span class="avlive"></span>LIVE</div>
      <div class="avmute" id="avmute">&#128263;</div>
      <div class="avname">SKY &middot; VIDEO CALL</div>
      <div class="avstat" id="avstat">ONLINE</div>
    </div>
    <div id="chat"></div>
    <div id="confirmbar"></div>
    <form id="f">
      <input id="inp" autocomplete="off"
        placeholder="Talk to SKY&hellip; e.g. open chrome &middot; what's slow? &middot; remind me in 10m to drink water">
      <button id="mic" type="button" title="Speak">&#127908;</button>
      <button type="submit">SEND</button>
    </form>
  </section>
  <aside>
    <div class="card"><h3>SYSTEM VITALS</h3><pre id="vitals">loading&hellip;</pre></div>
    <div class="card"><h3>REMINDERS</h3><div id="rems" class="none">&mdash;</div></div>
  </aside>
</main>
<script>
const $=id=>document.getElementById(id);
const chat=$("chat");
function bub(cls,txt){const d=document.createElement("div");d.className="bub "+cls;
  d.textContent=txt;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
function esc(s){return String(s).replace(/</g,"&lt;");}

function say(text){
  if(!text)return;
  avSet("speaking");
  fetch("/api/tts?text="+encodeURIComponent(text.slice(0,600)))
    .then(r=>r.ok?r.blob():Promise.reject())
    .then(b=>{const a=new Audio(URL.createObjectURL(b));
      a.onended=()=>avSet("online");a.play();})
    .catch(()=>{try{const u=new SpeechSynthesisUtterance(text);
      u.rate=1.02;u.onend=()=>avSet("online");speechSynthesis.speak(u);}
      catch(e){avSet("online");}});
}

/* ---- SKY VIDEO CALL: greeting clip plays on open; click toggles sound ---- */
const avcall=$("avcall"),avimg=$("avimg"),avvid=$("avvid"),avstat=$("avstat"),avmute=$("avmute");
let greetClip=null;
(function(){
  fetch("/api/avatar").then(r=>r.json()).then(a=>{
    if(a.greeting){greetClip="/avatar/clips/"+a.greeting;
      avvid.src=greetClip;avvid.muted=true;avmute.innerHTML="&#128263;";
      avvid.play().then(()=>{avvid.style.display="block";avimg.style.display="none";})
        .catch(()=>{avvid.style.display="none";avimg.style.display="block";});
    }
  }).catch(()=>{});
})();
function avSet(state){ // "online" | "speaking"
  avstat.textContent=state.toUpperCase();
  avcall.classList.toggle("talking",state==="speaking");
}
avcall.onclick=()=>{
  if(avvid.style.display!=="block"){return;}
  avvid.muted=!avvid.muted;
  avmute.innerHTML=avvid.muted?"&#128263;":"&#128266;";
  if(!avvid.muted){avvid.currentTime=0;avvid.play().catch(()=>{});}
};

let confirmTimer=null;
function startConfirmPoll(){
  confirmTimer=setInterval(async()=>{
    try{
      const p=await(await fetch("/api/pending")).json();
      const bar=$("confirmbar");
      if(p.pending&&p.pending.length){
        const c=p.pending[p.pending.length-1];
        bar.style.display="block";
        bar.innerHTML="&#9888; SKY asks permission: <b>"+esc(c.cmd)+"</b>"+
          "<button id='cy'>YES, RUN IT</button><button class='no' id='cn'>NO</button>";
        $("cy").onclick=()=>decide(c.id,true);
        $("cn").onclick=()=>decide(c.id,false);
      }
    }catch(e){}
  },1500);
}
function decide(id,answer){
  fetch("/api/confirm",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id,answer})});
  $("confirmbar").style.display="none";
}

$("f").onsubmit=async e=>{
  e.preventDefault();
  const inp=$("inp"),text=inp.value.trim();
  if(!text)return;
  inp.value="";
  bub("me",text);
  const t=bub("sky","thinking, sir");
  avSet("thinking");
  $("confirmbar").style.display="none";
  startConfirmPoll();
  try{
    const r=await fetch("/api/chat",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
    const j=await r.json();
    t.textContent=j.reply||("! "+(j.error||"no reply"));
    say(j.reply||"");
  }catch(err){t.textContent="! hub unreachable";}
  clearInterval(confirmTimer);
  $("confirmbar").style.display="none";
};

async function refresh(){
  try{
    const h=await(await fetch("/api/health")).json();
    $("st-ear").className="dot "+(h.daemons.skyear?"on":"off");
    $("st-skyd").className="dot "+(h.daemons.skyd?"on":"off");
  }catch(e){}
  try{const v=await(await fetch("/api/vitals")).json();
    $("vitals").textContent=v.report;}
  catch(e){$("vitals").textContent="unavailable";}
  try{
    const r=await(await fetch("/api/reminders")).json();
    const el=$("rems");
    const rows=(r.reminders||[]).map(x=>{
      const d=new Date(x.due*1000).toLocaleString([],
        {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
      return "<div class='rem'><b>#"+x.id+" &middot; "+d+"</b>"+esc(x.text)+"</div>";
    });
    el.innerHTML=rows.join("")||"none pending";
  }catch(e){}
}
refresh();setInterval(refresh,30000);

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$("mic").onclick=()=>{
  if(!SR){$("inp").placeholder="mic needs Chrome/Edge";return;}
  const r=new SR();r.lang="en-IN";r.interimResults=false;
  $("mic").classList.add("rec");
  r.onresult=e=>{$("inp").value=e.results[0][0].transcript;
    $("mic").classList.remove("rec");$("f").requestSubmit();};
  r.onerror=r.onend=()=>$("mic").classList.remove("rec");
  r.start();
};

bub("sky","Hub online, sir. My brain, memory and voice are wired in. How may I assist?");
</script>
</body>
</html>
